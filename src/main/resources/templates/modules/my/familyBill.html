<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:include="header"/>
<body>
<div id="familyBillapp" v-cloak>
    <div>
        <el-form :inline="true" ref="queryFormRef" :model="queryForm" class="demo-form-inline">
            <el-row type="flex" class="row-bg">
                <el-form-item label="关键字" prop="keyword">
                    <el-input v-model="queryForm.keyword" placeholder="关键字"></el-input>
                </el-form-item>

                <el-form-item label="关键字" prop="type">
                    <my-dict-select v-model="queryForm.type" type="billType"></my-dict-select>
                </el-form-item>

                <el-form-item label="用户" prop="userId">
                    <my-search-select v-model="queryForm.userId"
                                      search-url="/sys/user/list"
                                      search-param="orderBy-create_time desc,orderByEnabled-true"
                                      search-field-name="keyword"
                                      label-field-name="username"
                                      label-field-value="id"
                                      right-label-field-name="deptNames"
                    />
                </el-form-item>
            </el-row>
            <el-row type="flex" class="row-bg" justify="center">
                <el-form-item>
                    <el-button type="primary" @click="myQuery" icon="el-icon-search">查询</el-button>
                    <el-button @click="myQueryReset">重置</el-button>
                    <my-btn label="新增" type="primary" icon="el-icon-circle-plus" @click="myAdd" auth="${html.permissions}:add"></my-btn>
                    <my-btn label="导出" type="info" icon="el-icon-download" @click="listExport"  auth="${html.permissions}:list:export"></my-btn>
                </el-form-item>
            </el-row>
        </el-form>
        <my-table :show-summary="true" :columns="tableColumns" :page="page" :table-loading="tableLoading" @sortChange="sortchange" :default-sort="defaultSort"
                  v-on:pagesizechange="pagesizechange" v-on:currentpagechange="currentpagechange">
        </my-table>
        <el-dialog :close-on-click-modal="false" :title="addOrUpdateForm.title"
                   :visible.sync="addOrUpdateForm.familyBillFormVisible">
            <el-form ref="addOrUpdateFormRef" :rules="rules" :model="addOrUpdateForm.familyBill">
                        <el-form-item label="用户" prop="userId"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <my-search-select v-model="addOrUpdateForm.familyBill.userId"
                                              search-url="/sys/user/list"
                                              search-param="orderBy-create_time desc,orderByEnabled-true"
                                              search-field-name="keyword"
                                              label-field-name="username"
                                              label-field-value="id"
                                              right-label-field-name="deptNames"
                            />
                        </el-form-item>
                        <el-form-item label="类型" prop="type"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <my-dict-select v-model="addOrUpdateForm.familyBill.type" type="billType"></my-dict-select>
                        </el-form-item>
                        <el-form-item label="日期" prop="day"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <el-date-picker value-format="yyyy-MM-dd"
                                            v-model="addOrUpdateForm.familyBill.day"
                                            type="date"
                                            placeholder="选择日期">
                            </el-date-picker>
                        </el-form-item>
                        <el-form-item label="款项" prop="money"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <el-input-number controls-position="right" v-model="addOrUpdateForm.familyBill.money"
                                             :precision="2" :step="0.1" :min="0"></el-input-number>
                        </el-form-item>
                        <el-form-item label="地址" prop="addr"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <el-input  type="textarea" :row="2"  v-model="addOrUpdateForm.familyBill.addr"
                                       autocomplete="off" placeholder="地址"></el-input>
                        </el-form-item>
                        <el-form-item label="备注" prop="remark"
                                      :label-width="addOrUpdateForm.familyBillFormLabelWidth">
                            <el-input  type="textarea" :row="2" v-model="addOrUpdateForm.familyBill.remark"
                                       autocomplete="off" placeholder="备注"></el-input>
                        </el-form-item>
            </el-form>
            <div slot="footer" class="dialog-footer">
                <el-button @click="addOrUpdateForm.familyBillFormVisible = false">取 消</el-button>
                <el-button type="primary" @click="saveOrUpdate">确 定</el-button>
            </div>
        </el-dialog>
    </div>
</div>
<script src="/statics/js/modules/my/familyBill.js"></script>
</body>
</html>
